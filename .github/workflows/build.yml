# PDFDesk — Guido Cauli <guido.cauli@gmail.com>
# Compila e collauda l'eseguibile per macOS Apple Silicon (l'unico che non si può compilare altrove). Windows e Linux si compilano
# sul computer di sviluppo (vedi README) e le Release si pubblicano a mano con quei pacchetti, più lo zip macOS prodotto qui.
# macOS Intel non è compilato: cryptography 50 non ha più pacchetti per macOS x86_64. Python 3.11 e moduli di requirements.lock.
# Avvio: manuale (Actions → build → Run workflow) oppure push di un tag v*. Il risultato è l'artefatto «pdfdesk-macos-arm64».
name: build
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
permissions: { contents: read }
jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Ghostscript
        run: brew install ghostscript
      - run: "python -m pip install --only-binary=:all: -r requirements.lock"
      - run: "python -m pip install -r requirements-test.txt"        # odfpy è distribuito solo come sorgente: niente --only-binary
      - run: python check_build_env.py
      - name: Test
        timeout-minutes: 25
        continue-on-error: true            # un test fallito non blocca la compilazione: lo segnala (::error::)
        env: { QT_QPA_PLATFORM: offscreen }
        run: |
          for t in core gui features standards newfeatures mergescan; do python -I -W ignore tests/test_$t.py || echo "::error::test_$t non superato"; done
      - name: Compila
        working-directory: packaging
        run: python -m PyInstaller --noconfirm --clean --distpath ../dist --workpath ../build pdfdesk.spec
      - name: Collaudo dell'eseguibile
        run: dist/PDFDesk.app/Contents/MacOS/pdfdesk --selftest
      - name: Pacchetto
        run: |
          mkdir -p out
          VER=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' pdfdesk/__init__.py)
          cp packaging/macos/sblocca.sh dist/sblocca.sh && chmod +x dist/sblocca.sh
          (cd dist && ditto -c -k --keepParent PDFDesk.app ../out/pdfdesk-$VER-macos-arm64.zip && zip -q -g ../out/pdfdesk-$VER-macos-arm64.zip sblocca.sh)
      - uses: actions/upload-artifact@v4
        with:
          name: pdfdesk-macos-arm64
          path: out/*
